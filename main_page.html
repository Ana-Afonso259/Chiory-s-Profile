<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="javascript.js" defer></script>
<title>Chiory's Aesthetic Profile</title>
</head>
<body>

<div class="bg-texture"></div>

<!-- ===== MODAL: FOTO DE PERFIL ===== -->
<div class="modal-overlay hidden" id="avatarModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="section-diamond"></div>
            <span class="section-title">Foto de Perfil</span>
            <button class="modal-close" onclick="closeAvatarModal()">✕</button>
        </div>
        <div class="modal-grid" id="avatarGrid"></div>
    </div>
</div>

<!-- ===== MODAL: NAMECARD DE FUNDO ===== -->
<div class="modal-overlay hidden" id="namecardBgModal">
    <div class="modal-box modal-box--wide">
        <div class="modal-header">
            <div class="section-diamond"></div>
            <span class="section-title">Namecard de Fundo</span>
            <button class="modal-close" onclick="closeNamecardBgModal()">✕</button>
        </div>
        <div class="modal-grid modal-grid--cards" id="namecardBgGrid"></div>
    </div>
</div>

<!-- ===== TOP NAV ===== -->
<div class="top-nav">
    <button class="nav-btn active" id="btnChars" onclick="showCharacters()">Personagens</button>
    <div class="nav-divider"></div>
    <button class="nav-btn" id="btnCards" onclick="showNamecards()">Namecards</button>
</div>

<div class="main">

    <!-- ===== LEFT PANEL ===== -->
    <div class="left">

        <div class="namecard-banner" id="wallpaper">
            <div class="namecard-pattern"></div>
            <button class="banner-edit-btn" onclick="openNamecardBgModal()" title="Mudar namecard de fundo">✎</button>
        </div>

        <div class="avatar-area">
            <div class="avatar-frame" onclick="openAvatarModal()" title="Mudar foto de perfil">
                <div class="profile-pic" id="profilePic"></div>
                <div class="avatar-edit-hint">✎</div>
            </div>
            <div class="username-area">
                <div class="username">Chiory</div>
                <div class="uid">UID: 800000000</div>
            </div>
        </div>

        <div class="divider-gold"></div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Rank</div>
                <div class="stat-value">60</div>
                <div class="stat-sub">Adventure</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Mundo</div>
                <div class="stat-value">9</div>
                <div class="stat-sub">World Level</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Conquistas</div>
                <div class="stat-value">889</div>
                <div class="stat-sub">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Abyss</div>
                <div class="stat-value">11-1</div>
                <div class="stat-sub">Spiral</div>
            </div>
        </div>

        <div class="divider-gold"></div>

        <div class="bio-section">
            <div class="bio-label">Biografia</div>
            <textarea class="bio" placeholder="A Viajante chegou de longe..."></textarea>
        </div>

        <div class="divider-gold"></div>

        <!-- 12 slots de equipa -->
        <div class="team-section">
            <div class="bio-label">Equipa <span class="team-count" id="teamCount">0/12</span></div>
            <div class="team-slots" id="teamSlots"></div>
        </div>

        <div class="divider-gold"></div>

        <!-- slots de namecards colecionados -->
        <div class="team-section">
            <div class="bio-label">Namecards <span class="team-count" id="ncCount">0/9</span></div>
            <div class="nc-slots" id="ncSlots"></div>
        </div>

    </div>

    <!-- ===== RIGHT PANEL ===== -->
    <div class="right">

        <!-- PERSONAGENS -->
        <div class="characters" id="charactersSection">
            <div class="section-header">
                <div class="section-diamond"></div>
                <span class="section-title">Personagens</span>
                <div class="section-line"></div>
                <span class="section-hint">Clica para adicionar/remover da equipa (máx. 12)</span>
            </div>
            <div class="chars-grid" id="charsGrid">

                <button class="char-card" data-char="hutao" onclick="toggleCharacter('hutao', this)">
                    <span class="char-rarity">★★★★★</span>
                    <div class="char-check hidden">✓</div>
                    <img src="images/hutao.png" alt="Hu Tao">
                    <span class="char-name">Hu Tao</span>
                    <span class="char-element pyro">Pyro</span>
                </button>

                <button class="char-card" data-char="raiden" onclick="toggleCharacter('raiden', this)">
                    <span class="char-rarity">★★★★★</span>
                    <div class="char-check hidden">✓</div>
                    <img src="images/raiden.png" alt="Raiden">
                    <span class="char-name">Raiden</span>
                    <span class="char-element electro">Electro</span>
                </button>

                <button class="char-card" data-char="nahida" onclick="toggleCharacter('nahida', this)">
                    <span class="char-rarity">★★★★★</span>
                    <div class="char-check hidden">✓</div>
                    <img src="images/nahida.png" alt="Nahida">
                    <span class="char-name">Nahida</span>
                    <span class="char-element dendro">Dendro</span>
                </button>

                <button class="char-card" data-char="zhongli" onclick="toggleCharacter('zhongli', this)">
                    <span class="char-rarity">★★★★★</span>
                    <div class="char-check hidden">✓</div>
                    <img src="images/zhongli.png" alt="Zhongli">
                    <span class="char-name">Zhongli</span>
                    <span class="char-element geo">Geo</span>
                </button>

                <!-- Adiciona mais personagens abaixo com o mesmo padrão -->

            </div>
        </div>

        <!-- NAMECARDS -->
        <div class="namecards hidden" id="namecardsSection">
            <div class="section-header">
                <div class="section-diamond"></div>
                <span class="section-title">Namecards</span>
                <div class="section-line"></div>
                <span class="section-hint">Clica para adicionar/remover da coleção (máx. 9)</span>
            </div>
            <div class="cards-grid" id="cardsGrid">

                <button class="card-item" data-card="card1" onclick="toggleNamecard('card1', this)">
                    <div class="card-check hidden">✓</div>
                    <div class="card-preview inazuma">
                        <img src="images/card1.png" alt="Inazuma" onerror="this.style.display='none'">
                    </div>
                    <div class="card-footer">
                        <span class="card-nm">Inazuma</span>
                        <span class="card-region">Electro Nation</span>
                    </div>
                </button>

                <button class="card-item" data-card="card2" onclick="toggleNamecard('card2', this)">
                    <div class="card-check hidden">✓</div>
                    <div class="card-preview sumeru">
                        <img src="images/card2.png" alt="Sumeru" onerror="this.style.display='none'">
                    </div>
                    <div class="card-footer">
                        <span class="card-nm">Sumeru</span>
                        <span class="card-region">Dendro Nation</span>
                    </div>
                </button>

                <button class="card-item" data-card="card3" onclick="toggleNamecard('card3', this)">
                    <div class="card-check hidden">✓</div>
                    <div class="card-preview liyue">
                        <img src="images/card3.png" alt="Liyue" onerror="this.style.display='none'">
                    </div>
                    <div class="card-footer">
                        <span class="card-nm">Liyue</span>
                        <span class="card-region">Geo Nation</span>
                    </div>
                </button>

                <!-- Adiciona mais namecards abaixo com o mesmo padrão -->

            </div>
        </div>

    </div>
</div>

</body>
</html>
